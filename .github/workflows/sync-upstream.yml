name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync.mjs | tee sync.log
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- upstream team-kit agents skills; then
            echo "No upstream changes."
            exit 0
          fi
          commit=$(node -p "require('./upstream.lock.json').commit.slice(0, 7)")
          branch="sync-upstream-$commit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add upstream team-kit agents skills upstream.lock.json
          git commit -m "Sync upstream pstack to $commit"
          git push --force origin "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --head "$branch" --title "Sync upstream pstack to $commit" --body "$(printf '```\n%s\n```' "$(cat sync.log)")"
